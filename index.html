'Seoul Forest':['Từ Apgujeong Rodeo đi tuyến Suin-Bundang thẳng tới Seoul Forest (~15p).','서울숲'],
'Về gần nhà':['Seoul Forest → Line 2 Ttukseom → Dangsan, hoặc theo Naver.','서울 영등포구 양평로 102-2'],
'Di chuyển ra sân bay Incheon':['Bus 6001 như lịch trình (~1h20p). Phương án khác: Line 2 Dangsan → Hongik Univ. rồi AREX tới Incheon T1 (~50p).','인천국제공항 제1여객터미널']};
let D,cur=0,ed=null,OP=new Set(),MO=null;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!Array.isArray(D)||!D.length)D=fresh();
D.forEach(d=>d.it.forEach(i=>{if(i.mv===undefined){const m=MV[i.ti]||['',''];i.mv=m[0];i.nq=m[1]}}));
{const n=new Date();if(n.getFullYear()==2026&&n.getMonth()==10&&n.getDate()>=5&&n.getDate()<=11)cur=n.getDate()-5}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 $('tabs').innerHTML=D.map((x,i)=>`<button class="tab ${i==cur?'on':''}" data-d="${i}">${esc(x.t.split(' · ')[0])}<small>${esc(x.d)}</small></button>`).join('');
 const day=D[cur];$('dt').textContent=day.t+' ('+day.d+')';
 $('ht').innerHTML=(cur==2?[0,1]:[cur<2?0:1]).map(k=>{const h=HOT[k];return `<div class="hot"><b>🏨 ${esc(h.n)}</b>${esc(h.a)}<br>${esc(h.s)} <a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(h.q)}">🗺 Naver Map</a></div>`}).join('')+`<div class="sub">${MVN}</div>`;
 const tot=D.reduce((a,x)=>a+x.it.length,0),dn=D.reduce((a,x)=>a+x.it.filter(i=>i.ok).length,0);
 $('pg').style.width=(tot?dn/tot*100:0)+'%';$('pgt').textContent=`Đã xong ${dn}/${tot} hoạt động`;
 $('list').innerHTML=day.it.map((it,i)=>it.id===ed?form(it):card2(it,i)).join('');
}
const card=(it,i)=>`<div class="it ${it.ok?'done':''}"><input type="checkbox" class="ck" data-a="ck" data-i="${i}" ${it.ok?'checked':''}>
<div class="bd"><div class="tm">${esc(it.tm)}</div><div class="ti">${esc(it.ti)}</div>
${it.de?`<div class="de">${esc(it.de)}</div>`:''}${it.fd?`<span class="tag fd">🍜 ${esc(it.fd)}</span>`:''}${it.nt?`<span class="tag nt">📝 ${esc(it.nt)}</span>`:''}${it.mv?`<span class="tag mv">🚇 ${esc(it.mv)}</span>`:''}${it.nq?`<a class="nv" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(it.nq)}">🗺 Mở Naver Map</a>`:''}</div>
<div class="ac"><button data-a="ed" data-i="${i}">✎</button><button data-a="up" data-i="${i}">↑</button><button data-a="dn" data-i="${i}">↓</button><button data-a="rm" data-i="${i}">🗑</button></div></div>`;
const card2=(it,i)=>{const o=OP.has(it.id),sm=[it.fd&&'🍜',it.nt&&'📝',it.mv&&'🚇'].filter(Boolean).join(' ');
return `<div class="it ${it.ok?'done':''} ${o?'op':''}"><input type="checkbox" class="ck" data-a="ck" data-i="${i}" ${it.ok?'checked':''}>
<div class="bd"><div class="hd" data-a="tg" data-i="${i}"><div class="tm">${esc(it.tm)||'&nbsp;'}</div><div class="ti"><span class="chev">${o?'▼':'▶'}</span>${esc(it.ti)} <span class="sub">${sm}</span></div></div>
<div class="xp">${it.de?`<div class="de">${esc(it.de)}</div>`:''}${it.fd?`<span class="tag fd">🍜 ${esc(it.fd)}</span>`:''}${it.nt?`<span class="tag nt">📝 ${esc(it.nt)}</span>`:''}${it.mv?`<span class="tag mv">🚇 ${esc(it.mv)}</span>`:''}${it.nq?`<a class="nv" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(it.nq)}">🗺 Mở Naver Map</a>`:''}${!(it.de||it.fd||it.nt||it.mv||it.nq)?'<div class="sub">Chưa có chi tiết. Bấm ✎ để thêm.</div>':''}</div></div>
<div class="ac"><button data-a="ed" data-i="${i}">✎</button><button data-a="mo" data-i="${i}">⋯</button>${MO===it.id?`<button data-a="up" data-i="${i}">↑</button><button data-a="dn" data-i="${i}">↓</button><button data-a="rm" data-i="${i}">🗑</button>`:''}</div></div>`};
const form=it=>`<div class="it"><div class="bd"><label>Thời gian</label><input type="text" id="f-tm" value="${esc(it.tm)}">
<label>Nội dung</label><input type="text" id="f-ti" value="${esc(it.ti)}">
<label>Chi tiết hoạt động</label><textarea id="f-de">${esc(it.de)}</textarea>
<label>Ăn uống</label><textarea id="f-fd">${esc(it.fd)}</textarea>
<label>Note</label><textarea id="f-nt">${esc(it.nt)}</textarea>
<label>Cách di chuyển</label><textarea id="f-mv">${esc(it.mv)}</textarea>
<button class="pr" data-a="sv">Lưu</button> <button data-a="cn">Huỷ</button></div></div>`;
document.addEventListener('click',e=>{
 const b=e.target.closest('button,input.ck,.hd');if(!b)return;
 if(b.dataset.d!==undefined){cur=+b.dataset.d;ed=null;return render()}
 const a=b.dataset.a,i=+b.dataset.i,L=D[cur].it;
 if(a=='ck'){L[i].ok=b.checked?1:0}
 else if(a=='ed'){ed=L[i].id}
 else if(a=='up'&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]]}
 else if(a=='dn'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]]}
 else if(a=='rm'){if(confirm('Xoá hoạt động này?'))L.splice(i,1)}
 else if(a=='cn'){ed=null}
 else if(a=='tg'){const id=L[i].id;OP.has(id)?OP.delete(id):OP.add(id)}
 else if(a=='mo'){MO=MO===L[i].id?null:L[i].id}
 else if(a=='sv'){const it=L.find(x=>x.id===ed);if(it){it.tm=$('f-tm').value;it.ti=$('f-ti').value;it.de=$('f-de').value;it.fd=$('f-fd').value;it.nt=$('f-nt').value;it.mv=$('f-mv').value}ed=null}
 else return;
 save();render();
});
$('add').onclick=()=>{const it={id:Math.random().toString(36).slice(2,9),tm:'',ti:'Hoạt động mới',de:'',fd:'',nt:'',ok:0};D[cur].it.push(it);ed=it.id;save();render()};
$('de').onclick=()=>{const t=prompt('Tên ngày:',D[cur].t);if(t===null)return;const d=prompt('Thứ / ngày:',D[cur].d);D[cur].t=t||D[cur].t;if(d)D[cur].d=d;save();render()};
$('rs').onclick=()=>{if(confirm('Khôi phục lịch trình gốc? Mọi chỉnh sửa sẽ mất.')){D=fresh();cur=0;ed=null;save();render()}};
$('pt').onclick=()=>window.print();
$('ea').onclick=()=>{D[cur].it.forEach(x=>OP.add(x.id));render()};
$('ca').onclick=()=>{D[cur].it.forEach(x=>OP.delete(x.id));render()};
$('pv').onclick=()=>{cur=Math.max(0,cur-1);ed=null;MO=null;render();scrollTo(0,0)};
$('nx').onclick=()=>{cur=Math.min(D.length-1,cur+1);ed=null;MO=null;render();scrollTo(0,0)};
$('ex').onclick=()=>{const t=JSON.stringify(D,null,1);const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}el.remove();alert(ok?'Đã sao chép JSON vào clipboard. Dán vào file .json để sao lưu.':'Không sao chép được tự động.')};
$('im').onclick=()=>{const t=prompt('Dán nội dung JSON đã xuất:');if(!t)return;try{const x=JSON.parse(t);if(!Array.isArray(x)||!x.length)throw 0;D=x;cur=0;ed=null;save();render()}catch(e){alert('JSON không hợp lệ.')}};
render();
</script>
</body>
</html>
